<!DOCTYPE html>
<html>

<head>
    <title>Generate 10-inch Tablet Screenshots</title>
    <style>
        body {
            background: #111;
            color: white;
            padding: 40px;
            font-family: sans-serif;
            text-align: center;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: center;
        }

        .canvas-container {
            border: 2px solid #e94560;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            width: 80%;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .btn:hover {
            background: #ff6b6b;
        }
    </style>
</head>

<body>
    <h1>Your Google Play 10-inch Tablet Screenshots (16:9)</h1>
    <p>To show off the tablet experience, here are landscape versions! Click "Download All" to grab them.</p>
    <button class="btn" id="dl-btn">Download All 10-inch Screenshots</button>

    <div class="grid" id="grid">
        <!-- canvases injected here -->
    </div>

    <script>
        const width = 1920;
        const height = 1080;

        const screenshots = [
            {
                id: "screen1_desktop",
                name: "10inch_1_Dashboard.png",
                svg: `
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <rect x="0" y="0" width="1920" height="400" fill="url(#primary)" opacity="0.1"/>
  
  <text x="500" y="500" font-size="80" font-weight="900" fill="#ffffff" font-family="Arial, sans-serif">Learn German 🌍</text>
  <text x="500" y="600" font-size="60" font-weight="800" fill="url(#primary)" font-family="Arial, sans-serif">Through Real Conversations</text>
  <text x="500" y="700" font-size="34" fill="#a0a0a0" font-family="Arial, sans-serif">Welcome back, Learner! Ready for Day 1?</text>
  
  <rect x="1100" y="200" width="700" height="680" rx="40" fill="#1a1a2e" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Lesson Card -->
  <rect x="1150" y="300" width="600" height="240" rx="24" fill="rgba(52,152,219,0.15)" stroke="#3498db" stroke-width="3"/>
  <text x="1220" y="400" font-size="80" font-family="Arial, sans-serif">📚</text>
  <text x="1350" y="390" font-size="40" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Daily Lessons</text>
  <text x="1350" y="440" font-size="28" fill="#a0a0a0" font-family="Arial, sans-serif">Practice real-world scenarios</text>
  
  <rect x="1350" y="480" width="350" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="1350" y="480" width="150" height="16" rx="8" fill="#3498db"/>

  <!-- Basics Card -->
  <rect x="1150" y="580" width="600" height="240" rx="24" fill="rgba(46,204,113,0.15)" stroke="#2ecc71" stroke-width="3"/>
  <text x="1220" y="680" font-size="80" font-family="Arial, sans-serif">🔤</text>
  <text x="1350" y="670" font-size="40" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">German Basics</text>
  <text x="1350" y="720" font-size="28" fill="#a0a0a0" font-family="Arial, sans-serif">Pronouns, Articles &amp; more</text>

</svg>`
            },
            {
                id: "screen2_desktop",
                name: "10inch_2_Voice.png",
                svg: `
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#9b59b6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <rect x="150" y="150" width="1620" height="780" rx="40" fill="#1a1a2e" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <text x="960" y="300" font-size="36" fill="#a0a0a0" text-anchor="middle" font-family="Arial, sans-serif">Say it out loud</text>
  
  <!-- Dialogue bubbles -->
  <rect x="460" y="360" width="1000" height="160" rx="20" fill="rgba(52,152,219,0.2)"/>
  <text x="960" y="460" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">Ich hätte gern einen Kaffee.</text>
  
  <text x="960" y="580" font-size="34" fill="#a0a0a0" text-anchor="middle" font-family="Arial, sans-serif">I would like a coffee.</text>

  <!-- Mic icon -->
  <circle cx="960" cy="760" r="120" fill="#e94560" opacity="0.2"/>
  <circle cx="960" cy="760" r="80" fill="#e94560"/>
  <text x="960" y="785" font-size="64" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif">🎙️</text>
  <text x="960" y="930" font-size="36" fill="#2ecc71" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">Listening...</text>
</svg>`
            }
        ];

        const grid = document.getElementById('grid');
        const dlBtn = document.getElementById('dl-btn');
        const downloadLinks = [];

        screenshots.forEach(sc => {
            const container = document.createElement('div');
            container.className = 'canvas-container';

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);
            grid.appendChild(container);

            const ctx = canvas.getContext('2d');
            const img = new Image();
            const svgBlob = new Blob([sc.svg], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                downloadLinks.push({ name: sc.name, data: canvas.toDataURL('image/png') });
            };
            img.src = url;
        });

        dlBtn.onclick = () => {
            if (downloadLinks.length < screenshots.length) {
                alert("Images are still rendering, please wait a second.");
                return;
            }
            downloadLinks.forEach((linkObj, idx) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.download = linkObj.name;
                    a.href = linkObj.data;
                    a.click();
                }, idx * 500);
            });
        };
    </script>
</body>

</html>
