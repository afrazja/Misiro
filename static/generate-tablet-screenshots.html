            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;

            height: auto;
            display: block;

            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;

        .btn:hover {

        const grid = document.getElementById('grid');
        const dlBtn = document.getElementById('dl-btn');

        const downloadLinks = [];

        screenshots.forEach(sc => {
            const container = document.createElement('div');
            container.className = 'canvas-container';

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);
            grid.appendChild(container);

            const ctx = canvas.getContext('2d');
            const img = new Image();
            const svgBlob = new Blob([sc.svg], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);

            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                downloadLinks.push({ name: sc.name, data: canvas.toDataURL('image/png') });
            };
            img.src = url;
        });

        dlBtn.onclick = () => {
            if (downloadLinks.length < screenshots.length) {
                alert("Images are still rendering, please wait a second.");
                return;
            }
            // trigger downloads sequentially
            downloadLinks.forEach((linkObj, idx) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.download = linkObj.name;
                    a.href = linkObj.data;
                    a.click();
                }, idx * 500); // 500ms delay to ensure browser doesn't block multiples
            });
        };
