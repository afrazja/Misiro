<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#22385a"/>
			<stop offset="0.4" stop-color="#5a5577"/>
			<stop offset="0.72" stop-color="#e7a270"/>
		</linearGradient>
		<radialGradient id="glow">
			<stop offset="0" stop-color="#ffd98a" stop-opacity="0.85"/>
			<stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="screen-glow">
			<stop offset="0" stop-color="#b8f5d8" stop-opacity="0.9"/>
			<stop offset="1" stop-color="#b8f5d8" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe2a3"/>
			<stop offset="1" stop-color="#f3b866"/>
